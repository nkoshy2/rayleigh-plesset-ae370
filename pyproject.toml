[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rp"
version = "0.1.0"
description = "From-scratch time integrators for Rayleigh-Plesset bubble dynamics (AE 370 Project 1)"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
